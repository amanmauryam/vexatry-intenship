<header class="fixed top-0 right-0 left-0 lg:left-64 h-16 bg-ivory/90 backdrop-blur-xl border-b border-ink z-30">
    <div class="h-full flex items-center px-4 sm:px-6 lg:px-8">
        <button onclick="toggleSidebar()" class="lg:hidden p-2 -ml-2 border border-transparent text-muted transition-colors duration-200 hover:border-ink hover:text-navy">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
        </button>
        <div class="sm:ml-4">
            <h1 class="text-base sm:text-lg font-extrabold text-navy uppercase tracking-tight leading-tight">{% block page_title %}Applicant Dashboard{% endblock %}</h1>
            <p class="label text-muted leading-tight">{% block page_subtitle %}{% endblock %}</p>
        </div>
    </div>
</header>
