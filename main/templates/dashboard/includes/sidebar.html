<div id="sidebar-overlay" class="fixed inset-0 bg-navy/40 backdrop-blur-sm z-40 hidden lg:hidden transition-opacity duration-300" onclick="toggleSidebar()"></div>

<aside id="dashboard-sidebar" class="fixed top-0 left-0 z-50 h-full w-64 bg-ivory border-r border-ink transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-out flex flex-col">

    <div class="h-16 flex items-center gap-3 px-5 border-b border-ink shrink-0">
        <div>
            <a href="{% url 'manage_dashboard' %}" class="text-base font-extrabold text-navy uppercase tracking-tight leading-none block">
                Hello ,
            </a>

            <span class="label text-muted">{{ candidate.name }}</span>

        </div>
    </div>

    <nav class="flex-1 px-3 py-5 space-y-2 overflow-y-auto overflow-x-hidden">

        <a href="{% url 'manage_dashboard' %}" class="sidebar-link sidebar-link-active">
            <span class="sidebar-icon">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                         d="M20 21a8 8 0 00-16 0m12-12a4 4 0 11-8 0 4 4 0 018 0z"/>
                </svg>
            </span>
            <span>Your Profile</span>
        </a>


    </nav>

    <div class="px-3 py-4 border-t border-ink shrink-0 space-y-2">
        <div class="flex items-center gap-3 px-3 py-2.5 bg-softblue border border-ink">
            <div class="w-9 h-9 border border-ink bg-brand flex items-center justify-center text-sm font-extrabold text-white shrink-0">
                {{ request.user.email|first|upper }}
            </div>
            <div class="flex-1 min-w-0">
                <p class="text-sm font-bold text-navy truncate leading-tight">{{ request.user.email }}</p>
                <p class="label text-muted">Internship candidate</p>
            </div>
        </div>

        <a href="{% url 'home' %}" class="sidebar-link">
            <span class="sidebar-icon">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M19 12H5"/>
                    <polyline points="12 19 5 12 12 5"/>
                </svg>
            </span>
            <span>Back to Site</span>
        </a>

        <a href="{% url "logout" %}" class="sidebar-link hover:text-red-600">
            <span class="sidebar-icon hover:text-red-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
            </span>
            <span>Logout</span>
        </a>
    </div>
</aside>
