<div id="sidebar-overlay" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-40 hidden lg:hidden transition-opacity duration-300" onclick="toggleSidebar()"></div>

<aside id="dashboard-sidebar" class="fixed top-0 left-0 z-50 h-full w-64 bg-white border-r border-gray-100 shadow-xl shadow-gray-200/30 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-out flex flex-col">

    <div class="h-16 flex items-center gap-3 px-5 border-b border-gray-50 shrink-0">
        {% comment %} <div class="w-9 h-9 rounded-xl bg-yellow-500 flex items-center justify-center shadow-sm">
            <span class="text-sm font-black text-black">HR</span>
        </div> {% endcomment %}
        <div>
            <a href="{% url 'manage_dashboard' %}" class="text-base font-bold text-gray-900 leading-none tracking-tight block">
                Hello ,
            </a>
           
            <span class="text-[9px] font-semibold text-gray-400 tracking-[0.15em] uppercase">{{ candidate.name }}</span>
           
        </div>
    </div>

    <nav class="flex-1 px-3 py-5 space-y-0.5 overflow-y-auto overflow-x-hidden">

        <a href="{% url 'manage_dashboard' %}"
           class="relative flex items-center gap-3 px-3 py-2 h-11 text-sm font-medium text-yellow-700 bg-yellow-50 rounded-xl shadow-sm">
            <span class="w-7 h-7 rounded-lg bg-yellow-200 flex items-center justify-center shrink-0 text-yellow-500">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                         d="M20 21a8 8 0 00-16 0m12-12a4 4 0 11-8 0 4 4 0 018 0z"/>
                </svg>
            </span>
            <span>Your Profile</span>
        </a>

        
    </nav>

    <div class="px-3 py-4 border-t border-gray-50 shrink-0 space-y-1">
        <div class="flex items-center gap-3 px-3 py-2.5 bg-yellow-50/50 rounded-xl">
            <div class="w-9 h-9 rounded-xl bg-yellow-500 flex items-center justify-center text-sm font-black text-black shadow-sm shrink-0">
                {{ request.user.email|first|upper }}
            </div>
            <div class="flex-1 min-w-0">
                <p class="text-sm font-semibold text-gray-900 truncate leading-tight">{{ request.user.email }}</p>
                <p class="text-[10px] font-medium text-gray-400">Internship candidate</p>
            </div>
        </div>

        <a href="{% url 'home' %}"
           class="relative flex items-center gap-3 px-3 py-2 h-11 text-sm font-medium text-gray-500 rounded-xl transition-all duration-200 hover:bg-yellow-50 hover:text-gray-900">
            <span class="w-7 h-7 rounded-lg bg-gray-100 flex items-center justify-center shrink-0 text-gray-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M19 12H5"/>
                    <polyline points="12 19 5 12 12 5"/>
                </svg>
            </span>
            <span>Back to Site</span>
        </a>

        <a href=""
           class="relative flex items-center gap-3 px-3 py-2 h-11 text-sm font-medium text-gray-500 rounded-xl transition-all duration-200 hover:bg-red-50 hover:text-red-600">
            <span class="w-7 h-7 rounded-lg bg-gray-100 flex items-center justify-center shrink-0 text-gray-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
            </span>
            <span>Logout</span>
        </a>
    </div>
</aside>
